<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>Features</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">Features</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-list lines="none" style="margin-top: 1rem">
        <ion-item>
            <ion-icon name="logo-angular" slot="start" color="danger"></ion-icon>
            <ion-label>
                <h2>Angular</h2>
                <p>Modern frontend framework</p>
            </ion-label>
        </ion-item>

        <ion-item>
            <ion-icon name="logo-ionic" slot="start" color="primary"></ion-icon>
            <ion-label>
                <h2>Ionic + Capacitor</h2>
                <p>Build for iOS, Android & Web</p>
            </ion-label>
        </ion-item>

        <ion-item>
            <ion-icon name="server-outline" slot="start" color="success"></ion-icon>
            <ion-label>
                <h2>NestJS Backend</h2>
                <p>Powerful and scalable API</p>
            </ion-label>
        </ion-item>

        <ion-item>
            <ion-icon name="layers-outline" slot="start" color="warning"></ion-icon>
            <ion-label>
                <h2>Nx Monorepo</h2>
                <p>Clean and scalable architecture</p>
            </ion-label>
        </ion-item>
    </ion-list>
</ion-content>
